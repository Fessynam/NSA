<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — NSA Employee Management System</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="icon" href="assets/nsa-logo-color.svg" />
</head>
<body>
  <div class="app-shell">
  <aside class="sidebar" id="app-sidebar"></aside>

  <main class="page">
    <div class="page-header">
      <div>
        <h1>Dashboard</h1>
        <p class="page-subtitle" id="current-datetime"></p>
      </div>
    </div>

    <div class="dashboard-grid">
      <div class="stat-card">
        <div class="stat-value" id="employee-count">—</div>
        <div class="stat-label">Total Employees</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="department-count">—</div>
        <div class="stat-label">Total Departments</div>
      </div>
      <div class="stat-card" id="logins-today-card" style="display:none;">
        <div class="stat-value" id="logins-today-count">—</div>
        <div class="stat-label">Logins Today</div>
      </div>
    </div>

    <div class="card" style="margin-top: 1.5rem;">
      <p style="margin-top:0;">Welcome back, <strong id="welcome-name"></strong>. Use the sidebar to manage employees and departments.</p>
      <div style="display:flex; gap:0.6rem; flex-wrap: wrap;">
        <a href="employees.html" class="btn btn-primary">Manage Employees</a>
        <a href="departments.html" class="btn btn-outline">Manage Departments</a>
      </div>
    </div>

    <div class="card" style="margin-top: 1.5rem;">
      <h2 class="section-title">Employees by Department</h2>
      <div id="dept-breakdown"></div>
    </div>

    <div class="dashboard-two-col" id="admin-widgets" style="display:none;">
      <div class="card">
        <h2 class="section-title">Login Activity (Last 7 Days)</h2>
        <div id="login-activity-chart"></div>
      </div>
      <div class="card">
        <div class="page-header" style="margin-bottom: 0.75rem;">
          <h2 class="section-title" style="margin:0;">Recent Activity</h2>
          <a href="activity-log.html" class="btn btn-outline btn-sm">View all</a>
        </div>
        <div id="recent-activity-feed"></div>
      </div>
    </div>
  </main>
  </div>

  <script src="js/common.js"></script>
  <script>
    requireAuthOrRedirect();
    renderSidebar('dashboard');
    document.getElementById('welcome-name').textContent = getFullName();

    function updateClock() {
      const now = new Date();
      const dateStr = now.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      const timeStr = now.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
      document.getElementById('current-datetime').textContent = `${dateStr} · ${timeStr}`;
    }
    updateClock();
    setInterval(updateClock, 30000);

    (async () => {
      try {
        const [employees, departments] = await Promise.all([
          apiFetch('/employees'),
          apiFetch('/departments')
        ]);
        document.getElementById('employee-count').textContent = employees.length;
        document.getElementById('department-count').textContent = departments.length;

        const countByDept = {};
        employees.forEach(e => {
          if (e.department_id) countByDept[e.department_id] = (countByDept[e.department_id] || 0) + 1;
        });
        const maxCount = Math.max(1, ...departments.map(d => countByDept[d.id] || 0));

        const breakdownEl = document.getElementById('dept-breakdown');
        if (departments.length === 0) {
          breakdownEl.innerHTML = '<p style="color:#8b93a1;">No departments yet.</p>';
        } else {
          breakdownEl.innerHTML = departments.map(d => {
            const count = countByDept[d.id] || 0;
            const pct = Math.round((count / maxCount) * 100);
            return `
              <div class="dept-bar-row">
                <span>${escapeHtml(d.name)}</span>
                <span class="dept-bar-track"><span class="dept-bar-fill" style="width:${pct}%"></span></span>
                <span>${count}</span>
              </div>
            `;
          }).join('');
        }

        const role = getRole();
        if (role === 'admin' || role === 'support') {
          document.getElementById('admin-widgets').style.display = '';
          document.getElementById('logins-today-card').style.display = '';

          const logs = await apiFetch('/activity-log');

          const todayStr = new Date().toISOString().slice(0, 10);
          const loginsToday = logs.filter(l => l.action === 'login' && l.created_at.slice(0, 10) === todayStr).length;
          document.getElementById('logins-today-count').textContent = loginsToday;

          const days = [];
          for (let i = 6; i >= 0; i--) {
            const d = new Date();
            d.setDate(d.getDate() - i);
            days.push(d.toISOString().slice(0, 10));
          }
          const countByDay = {};
          days.forEach(d => { countByDay[d] = 0; });
          logs.forEach(l => {
            if (l.action !== 'login') return;
            const day = l.created_at.slice(0, 10);
            if (day in countByDay) countByDay[day]++;
          });
          const maxDayCount = Math.max(1, ...Object.values(countByDay));

          document.getElementById('login-activity-chart').innerHTML = days.map(d => {
            const count = countByDay[d];
            const pct = Math.round((count / maxDayCount) * 100);
            const label = new Date(`${d}T00:00:00`).toLocaleDateString(undefined, { weekday: 'short' });
            return `
              <div class="dept-bar-row">
                <span>${label}</span>
                <span class="dept-bar-track"><span class="dept-bar-fill" style="width:${pct}%"></span></span>
                <span>${count}</span>
              </div>
            `;
          }).join('');

          const feedEl = document.getElementById('recent-activity-feed');
          const recent = logs.slice(0, 6);
          if (recent.length === 0) {
            feedEl.innerHTML = '<p style="color:#8b93a1;">No activity recorded yet.</p>';
          } else {
            feedEl.innerHTML = recent.map(l => `
              <div class="activity-feed-item">
                <span>${escapeHtml(l.user_email || 'system')} — ${escapeHtml(l.action.replace(/_/g, ' '))}</span>
                <span class="activity-feed-time">${escapeHtml(formatTimestamp(l.created_at))}</span>
              </div>
            `).join('');
          }
        }
      } catch (err) {
        console.error(err);
      }
    })();
  </script>
</body>
</html>
