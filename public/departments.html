<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Departments — NSA Employee Management System</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="icon" href="assets/nsa-logo-color.svg" />
</head>
<body>
  <div class="app-shell">
  <aside class="sidebar" id="app-sidebar"></aside>

  <main class="page">
    <div class="page-header">
      <h1>Departments</h1>
      <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
        <button class="btn btn-outline" id="export-csv-btn"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px; margin-right:4px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Export CSV</button>
        <button class="btn btn-gold" id="add-department-btn">+ Add Department</button>
      </div>
    </div>

    <div class="card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Code</th>
              <th>Name</th>
              <th>Description</th>
              <th>Head</th>
              <th>Employees</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="departments-tbody"></tbody>
        </table>
      </div>
      <div class="empty-state" id="empty-state" style="display:none;">No departments found.</div>
    </div>
  </main>
  </div>

  <!-- Add/Edit Modal -->
  <div class="modal-overlay" id="form-modal-overlay">
    <div class="modal">
      <h2 id="form-modal-title">Add Department</h2>
      <form id="department-form">
        <input type="hidden" id="department-id" />
        <div style="display:flex; gap:0.75rem;">
          <div class="field" style="flex:1;">
            <label for="dept-name">Name</label>
            <input type="text" id="dept-name" required />
          </div>
          <div class="field" style="flex:0 0 110px;">
            <label for="dept-code">Code</label>
            <input type="text" id="dept-code" placeholder="ENG" maxlength="6" style="text-transform:uppercase;" />
          </div>
        </div>
        <div class="field">
          <label for="dept-description">Description</label>
          <input type="text" id="dept-description" />
        </div>
        <div class="field">
          <label for="dept-head">Department Head</label>
          <select id="dept-head">
            <option value="">— None —</option>
          </select>
        </div>
        <div class="error-msg" id="form-error"></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" id="cancel-form-btn" data-dismiss>Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Detail View Modal -->
  <div class="modal-overlay" id="detail-modal-overlay">
    <div class="modal">
      <h2>Department Details</h2>
      <div id="detail-content"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="close-detail-btn" data-dismiss>Close</button>
      </div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/departments.js"></script>
</body>
</html>
